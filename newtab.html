<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C-Home 启动页</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏：分类 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">C-Home</span>
          <span class="brand-tag">你的启动页</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-header">
          <span>分类</span>
          <button class="icon-btn" id="addCategoryBtn" aria-label="新建分类">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        <ul class="category-list" id="categoryList"></ul>
      </nav>

      <div class="sidebar-footer">
        <span class="hint">拖拽分类可排序</span>
        <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <header class="top-bar">
        <div class="greeting">
          <h1 id="greeting">你好</h1>
          <p class="date-line" id="dateLine"></p>
        </div>
        <div class="clock" id="clock" aria-live="off">00:00</div>
      </header>

      <section class="content">
        <div class="toolbar">
          <h2 class="main-title" id="mainTitle">全部站点</h2>
          <div class="main-actions">
            <div class="search-box">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="search" id="searchInput" class="search-input" placeholder="搜索站点…" autocomplete="off" />
            </div>
            <button class="btn primary" id="addSiteBtn">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>添加站点</span>
            </button>
          </div>
        </div>

        <section class="sites-grid" id="sitesGrid"></section>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-illustration">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <h3>该分类下还没有站点</h3>
          <p>添加常用站点，让启动页成为你的效率入口</p>
          <button class="btn primary" data-action="empty-add">添加第一个站点</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 站点添加/编辑弹窗 -->
  <div class="modal-overlay" id="siteModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="siteModalTitle">添加站点</h2>
        <button class="icon-btn" data-action="close-site-modal" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form class="modal-body" id="siteForm">
        <div class="form-row">
          <label for="siteName">站点名称</label>
          <input type="text" id="siteName" required placeholder="例如：GitHub" autocomplete="off" />
        </div>
        <div class="form-row">
          <label for="siteUrl">站点地址</label>
          <input type="text" id="siteUrl" required placeholder="例如：github.com" autocomplete="off" />
        </div>
        <div class="form-row">
          <label for="siteCategory">所属分类</label>
          <select id="siteCategory"></select>
        </div>
        <div class="preview-row">
          <span class="preview-label">图标预览</span>
          <div class="preview-card">
            <img id="previewIcon" class="preview-icon" alt="" />
            <span id="previewName" class="preview-name">站点名称</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-action="close-site-modal">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 分类命名弹窗 -->
  <div class="modal-overlay" id="categoryModal" hidden>
    <div class="modal small">
      <div class="modal-header">
        <h2 id="categoryModalTitle">新建分类</h2>
        <button class="icon-btn" data-action="close-category-modal" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form class="modal-body" id="categoryForm">
        <div class="form-row">
          <label for="categoryName">分类名称</label>
          <input type="text" id="categoryName" required placeholder="例如：工作" autocomplete="off" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-action="close-category-modal">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal small">
      <div class="modal-body">
        <div class="confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <p id="confirmText" class="confirm-text">确认操作？</p>
        <div class="modal-footer">
          <button type="button" class="btn" id="confirmCancel">取消</button>
          <button type="button" class="btn danger" id="confirmOk">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>设置 <span class="version-badge" id="versionBadge">v1.1.0</span></h2>
        <button class="icon-btn" data-action="close-settings-modal" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <section class="settings-section">
          <h3>数据备份</h3>
          <p class="settings-desc">导出当前所有分类和站点，或从 JSON 文件恢复。</p>
          <div class="settings-actions">
            <button type="button" class="btn" id="exportBtn">导出数据</button>
            <label class="btn import-label">
              <span>导入数据</span>
              <input type="file" id="importInput" accept=".json,application/json" hidden />
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>自动备份</h3>
          <p class="settings-desc">自动保存一份 JSON 到下载目录。可填写相对路径，如 <code>backups/c-home.json</code>。</p>
          <div class="form-row checkbox-row">
            <input type="checkbox" id="autoBackupEnabled" />
            <label for="autoBackupEnabled">启用自动备份</label>
          </div>
          <div class="form-row">
            <label for="autoBackupPath">备份文件路径</label>
            <input type="text" id="autoBackupPath" placeholder="例如：c-home-backup.json" autocomplete="off" />
          </div>
          <div class="form-row">
            <label for="autoBackupMode">备份时机</label>
            <select id="autoBackupMode">
              <option value="onChange">每次数据变更</option>
              <option value="interval">按间隔时间</option>
              <option value="daily">每天指定时间</option>
            </select>
          </div>
          <div class="form-row backup-option" id="intervalOption">
            <label for="autoBackupInterval">间隔时间（分钟）</label>
            <input type="number" id="autoBackupInterval" min="1" value="30" />
          </div>
          <div class="form-row backup-option" id="dailyOption">
            <label for="autoBackupTime">每天备份时间</label>
            <input type="time" id="autoBackupTime" value="14:00" />
          </div>
          <p class="settings-desc last-backup" id="lastBackupInfo"></p>
          <div class="settings-actions">
            <button type="button" class="btn" id="backupNowBtn">立即备份</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=4"></script>
</body>
</html>
